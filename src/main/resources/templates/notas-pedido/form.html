<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nota de Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
    (() => {
        const savedTheme = localStorage.getItem('obraControl.theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = savedTheme || (prefersDark ? 'dark' : 'light');
    })();
    </script>
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container-fluid note-form-shell">
    <div class="page-navigation mb-3">
        <a th:href="@{/}"><i class="bi bi-house"></i> Inicio</a>
        <i class="bi bi-chevron-right"></i>
        <a th:href="@{/notas-pedido}">Notas de pedido</a>
        <i class="bi bi-chevron-right"></i>
        <span th:text="${form.id == null ? 'Nueva nota' : 'Editar nota'}">Nota</span>
    </div>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <form method="post" th:action="@{/notas-pedido}" th:object="${form}" class="note-excel-form">
        <input type="hidden" th:field="*{id}">

        <section class="note-excel-sheet mb-3">
            <div class="note-excel-title-row">
                <div class="note-brand-cell">
                    <span class="note-brand-mark"><i class="bi bi-building-check"></i></span>
                    <div>
                        <strong>SiMENDE</strong>
                        <small>Constructora</small>
                    </div>
                </div>
                <div class="note-title-cell">
                    <span>NOTA DE PEDIDO</span>
                </div>
                <div class="note-meta-cell">
                    <div><strong>Codificacion:</strong> FO-OBR-029</div>
                    <div><strong>Version:</strong> 00</div>
                </div>
            </div>

            <div class="note-section-band">
                <span>Pedido</span>
                <span>Detalles</span>
            </div>

            <div class="note-data-grid">
                <label class="note-field note-field-small">
                    <span>Nota N</span>
                    <input class="form-control" th:field="*{numero}" required>
                </label>
                <label class="note-field note-field-small">
                    <span>Fecha</span>
                    <input class="form-control" type="date" th:field="*{fecha}" required>
                </label>
                <label class="note-field note-field-wide">
                    <span>Tipo de pedido</span>
                    <select class="form-select" th:field="*{tipo}" id="tipo-nota" onchange="actualizarTipoNota()">
                        <option th:each="tipo : ${tipos}" th:value="${tipo}" th:text="${tipo.descripcion}" th:data-precio="${tipo.usaPrecio()}"></option>
                    </select>
                </label>
                <label class="note-field note-field-small">
                    <span>Prioridad</span>
                    <select class="form-select" th:field="*{prioridad}">
                        <option th:each="prioridad : ${prioridades}" th:value="${prioridad}" th:text="${prioridad.descripcion}"></option>
                    </select>
                </label>
                <label class="note-field note-field-small">
                    <span>Estado</span>
                    <select class="form-select" th:field="*{estado}">
                        <option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado.descripcion}"></option>
                    </select>
                </label>
                <label class="note-field note-field-small">
                    <span>Solicita</span>
                    <input class="form-control" th:field="*{solicitante}" placeholder="AGT">
                </label>
                <label class="note-field note-field-wide">
                    <span>Proveedor / contratista</span>
                    <select class="form-select" th:field="*{proveedorId}">
                        <option value="">Sin definir</option>
                        <option th:each="proveedor : ${proveedores}" th:value="${proveedor.id}" th:text="${proveedor.nombre}"></option>
                    </select>
                </label>
                <label class="note-field note-field-wide">
                    <span>OC generada</span>
                    <select class="form-select" th:field="*{ordenCompraId}">
                        <option value="">Pendiente</option>
                        <option th:each="oc : ${ordenesCompra}" th:value="${oc.id}" th:text="${'OC ' + oc.numero + ' - ' + (oc.proveedorEntidad != null ? oc.proveedorEntidad.nombre : '-')}"></option>
                    </select>
                </label>
                <div class="note-toggle-box">
                    <label class="form-check"><input class="form-check-input" type="checkbox" th:field="*{comparativa}"><span class="form-check-label">Comparativa</span></label>
                    <label class="form-check"><input class="form-check-input" type="checkbox" th:field="*{verStock}"><span class="form-check-label">Ver stock</span></label>
                </div>
            </div>

            <label class="note-observation-field">
                <span>Observaciones</span>
                <textarea class="form-control" rows="2" th:field="*{observaciones}" placeholder="Aclaraciones, condicion de compra, entrega o comentarios internos"></textarea>
            </label>
        </section>

        <section class="note-items-card mb-3">
            <div class="note-items-toolbar">
                <div>
                    <div class="document-kicker">Items</div>
                    <h2>Detalle del pedido</h2>
                </div>
                <button class="btn btn-primary" type="button" onclick="agregarItemNota()"><i class="bi bi-plus-lg"></i> Agregar item</button>
            </div>
            <div class="note-items-scroll">
                <table class="table align-middle note-items-table" id="nota-items-table">
                    <colgroup>
                        <col class="note-col-item">
                        <col class="note-col-detail">
                        <col class="note-col-unit">
                        <col class="note-col-qty">
                        <col class="note-col-price price-column">
                        <col class="note-col-total price-column">
                        <col class="note-col-obs">
                        <col class="note-col-base">
                        <col class="note-col-delivery">
                        <col class="note-col-action">
                    </colgroup>
                    <thead>
                    <tr>
                        <th>Item</th>
                        <th>Detalle</th>
                        <th>Und</th>
                        <th class="text-end">Cant.</th>
                        <th class="price-column text-end">$ Unit.</th>
                        <th class="price-column text-end">$ Total</th>
                        <th>Observaciones</th>
                        <th>Base</th>
                        <th>Entrega</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item, st : *{items}">
                        <td><input type="hidden" th:field="*{items[__${st.index}__].id}"><input class="form-control item-input" th:field="*{items[__${st.index}__].item}" th:placeholder="${st.index + 1}"></td>
                        <td><textarea class="form-control detail-input" rows="3" th:field="*{items[__${st.index}__].detalle}" placeholder="Descripcion del trabajo, material o consulta de presupuesto"></textarea></td>
                        <td><input class="form-control unit-input" th:field="*{items[__${st.index}__].unidad}" placeholder="m2"></td>
                        <td><input class="form-control quantity-input text-end" type="number" step="0.01" th:field="*{items[__${st.index}__].cantidad}" oninput="recalcularNota(this)"></td>
                        <td class="price-column"><input class="form-control price-input text-end" type="number" step="0.01" th:field="*{items[__${st.index}__].precioUnitario}" oninput="recalcularNota(this)"></td>
                        <td class="price-column"><input class="form-control amount-input text-end" type="number" step="0.01" th:field="*{items[__${st.index}__].importe}" readonly></td>
                        <td><input class="form-control observation-input" th:field="*{items[__${st.index}__].observacion}"></td>
                        <td><input class="form-control base-input" th:field="*{items[__${st.index}__].base}"></td>
                        <td><input class="form-control delivery-input" th:field="*{items[__${st.index}__].entrega}"></td>
                        <td><button class="btn btn-sm btn-outline-danger table-icon-action" type="button" onclick="eliminarItemNota(this)" title="Eliminar"><i class="bi bi-trash"></i></button></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <div class="note-form-footer mb-4">
            <div class="note-total-box price-column-total">
                <span>Total pedido</span>
                <strong id="total-nota">0,00</strong>
            </div>
            <div class="note-footer-actions">
                <a class="btn btn-outline-secondary" th:href="@{/notas-pedido}"><i class="bi bi-arrow-left"></i> Cancelar</a>
                <button class="btn btn-primary" type="submit"><i class="bi bi-check2-circle"></i> Guardar nota</button>
            </div>
        </div>
    </form>
</main>
<script>
function usaPrecioNota() {
    const select = document.querySelector('#tipo-nota');
    return select.selectedOptions[0]?.dataset.precio === 'true';
}
function actualizarTipoNota() {
    const usaPrecio = usaPrecioNota();
    document.querySelector('#nota-items-table').classList.toggle('without-price', !usaPrecio);
    document.querySelector('.price-column-total').classList.toggle('d-none', !usaPrecio);
    document.querySelectorAll('.price-input').forEach(input => {
        input.disabled = !usaPrecio;
        if (!usaPrecio) input.value = '0';
    });
    recalcularTotalNota();
}
function agregarItemNota() {
    const tbody = document.querySelector('#nota-items-table tbody');
    const index = tbody.children.length;
    const row = document.createElement('tr');
    row.innerHTML = `<td><input type="hidden" name="items[${index}].id"><input class="form-control item-input" name="items[${index}].item" value="${index + 1}"></td><td><textarea class="form-control detail-input" rows="3" name="items[${index}].detalle" placeholder="Descripcion del trabajo, material o consulta de presupuesto"></textarea></td><td><input class="form-control unit-input" name="items[${index}].unidad" placeholder="m2"></td><td><input class="form-control quantity-input text-end" type="number" step="0.01" name="items[${index}].cantidad" value="0" oninput="recalcularNota(this)"></td><td class="price-column"><input class="form-control price-input text-end" type="number" step="0.01" name="items[${index}].precioUnitario" value="0" oninput="recalcularNota(this)"></td><td class="price-column"><input class="form-control amount-input text-end" type="number" step="0.01" name="items[${index}].importe" value="0.00" readonly></td><td><input class="form-control observation-input" name="items[${index}].observacion"></td><td><input class="form-control base-input" name="items[${index}].base"></td><td><input class="form-control delivery-input" name="items[${index}].entrega"></td><td><button class="btn btn-sm btn-outline-danger table-icon-action" type="button" onclick="eliminarItemNota(this)" title="Eliminar"><i class="bi bi-trash"></i></button></td>`;
    tbody.appendChild(row);
    actualizarTipoNota();
}
function eliminarItemNota(button) {
    if (!confirm('Eliminar este item?')) return;
    button.closest('tr').remove();
    reindexarItemsNota();
    recalcularTotalNota();
}
function reindexarItemsNota() {
    document.querySelectorAll('#nota-items-table tbody tr').forEach((row, index) => {
        row.querySelectorAll('input, textarea').forEach(field => {
            if (field.name) field.name = field.name.replace(/items\[\d+]/, `items[${index}]`);
        });
    });
}
function recalcularNota(input) {
    const row = input.closest('tr');
    const cantidad = parseFloat(row.querySelector('.quantity-input').value || '0');
    const precio = usaPrecioNota() ? parseFloat(row.querySelector('.price-input').value || '0') : 0;
    row.querySelector('.amount-input').value = (cantidad * precio).toFixed(2);
    recalcularTotalNota();
}
function recalcularTotalNota() {
    const total = Array.from(document.querySelectorAll('.amount-input')).reduce((sum, input) => sum + parseFloat(input.value || '0'), 0);
    document.querySelector('#total-nota').textContent = new Intl.NumberFormat('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(total);
}
document.querySelectorAll('#nota-items-table tbody tr').forEach(row => recalcularNota(row.querySelector('.quantity-input') || row));
actualizarTipoNota();
</script>
</body>
</html>
