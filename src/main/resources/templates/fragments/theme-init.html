<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"><head>
<script th:fragment="init">
(() => {
    const root = document.documentElement;
    let theme = 'light', palette = 'blue';
    try {
        const saved = localStorage.getItem('obraControl.theme');
        if (saved === 'dark' || saved === 'light') theme = saved;
        palette = localStorage.getItem('obraControl.palette') || palette;
    } catch (_) { /* Default theme works when browser storage is unavailable. */ }
    root.dataset.theme = theme;
    root.dataset.bsTheme = theme;
    root.dataset.palette = palette;
    root.style.colorScheme = theme;
    const aplicarTipografiaCompacta = () => {
        if (document.getElementById('tipografia-compacta-app')) return;
        const hoja = document.createElement('link');
        hoja.id = 'tipografia-compacta-app';
        hoja.rel = 'stylesheet';
        hoja.href = '/css/tipografia-compacta.css?v=20261127-2';
        document.head.appendChild(hoja);
    };
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', aplicarTipografiaCompacta, { once: true });
    } else {
        aplicarTipografiaCompacta();
    }
})();
</script>
</head></html>
