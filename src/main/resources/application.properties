spring.datasource.url=jdbc:mysql://localhost:3306/certificaciones_obra?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

app.security.user=${APP_USER:admin}
app.security.password=${APP_PASSWORD:control}

# Optimizacion de consultas y renderizado
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.web.resources.cache.period=1h
spring.web.resources.chain.cache=false

# Sincronizacion local con GitHub
app.sync.project-root=.
app.sync.mysqldump=C:\\xampp\\mysql\\bin\\mysqldump.exe
app.sync.backup-path=backups\\certificaciones_obra.sql
